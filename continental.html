<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Continental · Marcador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#122e26">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="back" href="index.html">‹ Hub de juegos</a>
<h1>🃏 Continental</h1>
<div class="sub">Hasta 8 jugadores. Suma la puntuación de cada ronda y se acumula en el total.</div>

<div id="setup">
  <div id="setupInputs"></div>
  <button class="btn" id="startBtn">Empezar partida</button>
</div>

<div id="winnerBanner"></div>
<div id="players"></div>

<div class="toolbar hidden" id="toolbar">
  <button class="btn secondary" id="resetBtn">Reiniciar puntos</button>
  <button class="btn secondary" id="newGameBtn">Nueva partida</button>
</div>

<script src="js/scorer.js"></script>
<script>
initScorer({
  gameId: 'continental',
  gameName: 'Continental',
  maxPlayers: 8,
  minPlayers: 2,
  lowWins: true,
  trackPhases: true,
  maxPhases: 9,
  phases: [
    'Fase 1: (pon aquí la descripción real)',
    'Fase 2: (pon aquí la descripción real)',
    'Fase 3: (pon aquí la descripción real)',
    'Fase 4: (pon aquí la descripción real)',
    'Fase 5: (pon aquí la descripción real)',
    'Fase 6: (pon aquí la descripción real)',
    'Fase 7: (pon aquí la descripción real)',
    'Fase 8: (pon aquí la descripción real)',
    'Fase 9: (pon aquí la descripción real)'
  ]
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
