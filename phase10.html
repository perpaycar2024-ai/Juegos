<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phase 10 · Marcador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#122e26">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="back" href="index.html">‹ Hub de juegos</a>
<h1>🎴 Phase 10</h1>
<div class="sub">Gana quien tiene <b>menos</b> puntos al terminar. Suma la puntuación de cada ronda y controla en qué fase va cada uno.</div>

<div id="setup">
  <div id="setupInputs"></div>
  <button class="btn" id="startBtn">Empezar partida</button>
</div>

<div id="winnerBanner"></div>
<div id="players"></div>

<div class="toolbar hidden" id="toolbar">
  <button class="btn secondary" id="resetBtn">Reiniciar puntos</button>
  <button class="btn secondary" id="newGameBtn">Nueva partida</button>
</div>

<script src="js/scorer.js"></script>
<script>
initScorer({
  gameId: 'phase10',
  gameName: 'Phase 10',
  maxPlayers: 4,
  minPlayers: 2,
  lowWins: true,
  threshold: 200,
  trackPhases: true,
  maxPhases: 10
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
