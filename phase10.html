<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phase 10 · Marcador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#122e26">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="back" href="index.html">‹ Hub de juegos</a>
<h1 id="pageTitle">🎴 Phase 10</h1>
<div class="sub" id="pageSub">Gana quien tiene <b>menos</b> puntos al terminar. Suma la puntuación de cada ronda y controla en qué fase va cada uno.</div>

<div id="setup">
  <div id="setupInputs"></div>
  <button class="btn" id="startBtn">Empezar partida</button>
</div>

<div id="winnerBanner"></div>
<div id="players"></div>

<div class="toolbar hidden" id="toolbar">
  <button class="btn secondary" id="resetBtn">Reiniciar puntos</button>
  <button class="btn secondary" id="newGameBtn">Nueva partida</button>
</div>

<script src="js/scorer.js"></script>
<script>
initScorer({
  gameId: 'phase10',
  gameName: 'Phase 10',
  maxPlayers: 4,
  minPlayers: 2,
  lowWins: true,
  threshold: 200,
  trackPhases: true,
  maxPhases: 10,
  phaseLabels: ['3+3', '3+E4', '4+E4', 'E7', 'E8', 'E9', '4+4', '7 color', '5+2', '5+3'],
  phases: [
    'Fase 1: dos grupos de 3 cartas iguales',
    'Fase 2: un grupo de 3 cartas iguales + una escalera de 4',
    'Fase 3: un grupo de 4 cartas iguales + una escalera de 4',
    'Fase 4: una escalera de 7 cartas',
    'Fase 5: una escalera de 8 cartas',
    'Fase 6: una escalera de 9 cartas',
    'Fase 7: dos grupos de 4 cartas iguales',
    'Fase 8: 7 cartas del mismo color',
    'Fase 9: un grupo de 5 + un grupo de 2 cartas iguales',
    'Fase 10: un grupo de 5 + un grupo de 3 cartas iguales'
  ]
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
