<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hub de Juegos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#122e26">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>🎲 Hub de Juegos</h1>
<div class="sub">Marcador rápido para las partidas de mesa. Elige un juego para empezar.</div>

<div class="hub-grid" id="grid"></div>

<script>
// Para añadir un juego nuevo en el futuro: añade un objeto aquí y crea su .html
// copiando phase10.html / islacalavera.html como plantilla.
const GAMES = [
  { id:'phase10', title:'Phase 10', file:'phase10.html', icon:'🎴', meta:'2-4 jugadores', color:'red' },
  { id:'islacalavera', title:'Isla Calavera', file:'islacalavera.html', icon:'☠️', meta:'2-6 jugadores', color:'teal' },
  { id:'continental', title:'Continental', file:'continental.html', icon:'🃏', meta:'2-8 jugadores', color:'blue' },
  { id:'rummikub', title:'Rummikub', file:'rummikub.html', icon:'🀄', meta:'2-6 jugadores', color:'purple' },
];

const grid = document.getElementById('grid');
GAMES.forEach(g => {
  const a = document.createElement('a');
  a.href = g.file;
  a.className = 'chip';
  a.style.setProperty('--chip-accent', 'var(--'+g.color+')');
  a.innerHTML = `
    <div class="icon">${g.icon}</div>
    <div class="title">${g.title}</div>
    <div class="meta">${g.meta}</div>
  `;
  grid.appendChild(a);
});

const soon = document.createElement('div');
soon.className = 'chip soon';
soon.innerHTML = `<div class="icon">➕</div><div class="title">Próximamente</div><div class="meta">más juegos aquí</div>`;
grid.appendChild(soon);

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
